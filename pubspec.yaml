name: ahenfie_media
description: "Ahenfie Radio and TV- Kumasi, Ghana"
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Core Features
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.10
  audio_service: ^0.18.10
  video_player: ^2.8.1
  chewie: ^1.5.0
  webview_flutter: ^4.7.0
  lottie: ^3.3.1
  wakelock_plus: ^1.3.2 
  marquee: ^2.2.1
  change_app_package_name: ^1.5.0
  rxdart: ^0.28.0
  shared_preferences: ^2.5.3
  upgrader: ^12.1.0
  package_info_plus: ^9.0.0
  flutter_cache_manager: ^3.4.1
  android_pip: ^2.0.1
  provider: ^6.1.5+1
  path_provider: ^2.1.5
  

  # UI
  cupertino_icons: ^1.0.8
  animated_splash_screen: ^1.3.0
  page_transition: ^2.0.9
  url_launcher: ^6.3.2
  font_awesome_flutter: ^10.9.1
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: ^3.0.3
  audio_session: ^0.2.2
  riverpod: ^3.0.3
  http: ^1.6.0
  firebase_analytics: ^12.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"


flutter:
  uses-material-design: true



  assets:
    - assets/images/logo.jpeg
    - assets/images/noti.png
    - assets/animations/NoConnection.json
    - assets/animations/nodata.json
    - assets/animations/podcast.json
    - assets/sounds/chime.mp3
    
